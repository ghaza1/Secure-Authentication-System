<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center">Sign Up</h2>
        <form id="signupForm">
            <div class="mb-4">
                <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
                <input type="text" id="username" name="username" class="mt-1 block w-full px-3 py-2 border rounded-md" required>
            </div>
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" name="email" class="mt-1 block w-full px-3 py-2 border rounded-md" required>
            </div>
            <div class="mb-4">
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" name="password" class="mt-1 block w-full px-3 py-2 border rounded-md" required>
            </div>
            <div class="mb-4 flex items-center">
                <input type="checkbox" id="rememberMe" name="rememberMe" class="h-4 w-4 text-blue-600">
                <label for="rememberMe" class="ml-2 text-sm text-gray-600">Remember Me</label>
            </div>
            <div class="mb-4 flex items-center">
                <input type="checkbox" id="enable2FA" name="enable2FA" class="h-4 w-4 text-blue-600">
                <label for="enable2FA" class="ml-2 text-sm text-gray-600">Enable Two-Factor Authentication</label>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700">Sign Up</button>
        </form>
        <div id="qrCode" class="mt-4 hidden text-center">
            <p class="text-sm text-gray-600">Scan this QR code with your authenticator app:</p>
            <img id="qrCodeImg" class="mx-auto mt-2">
        </div>
        <p class="mt-4 text-center text-sm">Already have an account? <a href="/login" class="text-blue-600">Login</a></p>
        <p id="error" class="mt-4 text-red-500 text-center hidden"></p>
    </div>
    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const enable2FA = document.getElementById('enable2FA').checked;
            const errorEl = document.getElementById('error');
            const qrCodeDiv = document.getElementById('qrCode');
            const qrCodeImg = document.getElementById('qrCodeImg');

            try {
                const response = await fetch('/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password, rememberMe, enable2FA })
                });
                const data = await response.json();
                if (response.ok) {
                    if (data.qrCodeUrl) {
                        qrCodeImg.src = data.qrCodeUrl;
                        qrCodeDiv.classList.remove('hidden');
                    }
                    localStorage.setItem('token', data.token);
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 5000);
                } else {
                    errorEl.textContent = data.error;
                    errorEl.classList.remove('hidden');
                }
            } catch (err) {
                errorEl.textContent = 'Network error';
                errorEl.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>

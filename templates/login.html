<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center">Login</h2>
        <form id="loginForm">
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" name="email" class="mt-1 block w-full px-3 py-2 border rounded-md" required>
            </div>
            <div class="mb-4">
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" name="password" class="mt-1 block w-full px-3 py-2 border rounded-md" required>
            </div>
            <div class="mb-4 flex items-center">
                <input type="checkbox" id="rememberMe" name="rememberMe" class="h-4 w-4 text-blue-600">
                <label for="rememberMe" class="ml-2 text-sm text-gray-600">Remember Me</label>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700">Login</button>
        </form>
        <div class="mt-4 text-center">
            <a href="/auth/github" class="bg-gray-800 text-white py-2 px-4 rounded-md inline-block">Login with GitHub</a>
        </div>
        <p class="mt-4 text-center text-sm">Don't have an account? <a href="/signup" class="text-blue-600">Sign Up</a></p>
        {% if error %}
        <p id="error" class="mt-4 text-red-500 text-center">{{ error }}</p>
        {% else %}
        <p id="error" class="mt-4 text-red-500 text-center hidden"></p>
        {% endif %}
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const errorEl = document.getElementById('error');

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, rememberMe })
                });
                const data = await response.json();
                if (response.ok) {
                    if (data.requires2FA) {
                        localStorage.setItem('tempToken', data.tempToken);
                        window.location.href = '/2fa';
                    } else {
                        localStorage.setItem('token', data.token);
                        window.location.href = '/dashboard';
                    }
                } else {
                    errorEl.textContent = data.error;
                    errorEl.classList.remove('hidden');
                }
            } catch (err) {
                errorEl.textContent = 'Network error';
                errorEl.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
